name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project services/api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm types:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:setup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-browser-evidence
          path: |
            test-results/
            playwright-report/
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: frontier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      FRONTIER_ENV: test
      FRONTIER_TEST_DATABASE_URL: postgresql+asyncpg://frontier:ci_only@localhost:5432/frontier_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m app.export_openapi --check
      - run: uv run pytest -q
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: .
      - run: pnpm test:sources
        working-directory: .
      - run: pnpm test:extension
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-browser-evidence
          path: |
            test-results/
            playwright-report/
